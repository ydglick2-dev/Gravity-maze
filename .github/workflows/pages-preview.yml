name: Publish preview to GitHub Pages

# Serves this branch directly through GitHub Pages so the Bubble Merge
# prototype can be played on a phone. Does not touch the default branch.

on:
  push:
    branches: [claude/game-ideas-3snmlv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: pages-preview
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Point GitHub Pages at this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh api "/repos/$REPO/pages" >/dev/null 2>&1; then
            echo "Pages already enabled — updating source to $BRANCH"
            gh api --method PUT "/repos/$REPO/pages" \
              -f "source[branch]=$BRANCH" -f "source[path]=/"
          else
            echo "Enabling Pages on $BRANCH"
            gh api --method POST "/repos/$REPO/pages" \
              -f "source[branch]=$BRANCH" -f "source[path]=/"
          fi

      - name: Report the URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base=$(gh api "/repos/$REPO/pages" --jq .html_url)
          echo "Pages root: $base"
          echo "### Bubble Merge preview" >> "$GITHUB_STEP_SUMMARY"
          echo "${base}bubble-merge/" >> "$GITHUB_STEP_SUMMARY"
