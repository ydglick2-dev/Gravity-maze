name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  dsp-tests:
    # The DSP tests need only a host compiler, so they run first and fail fast: a broken
    # pitch shifter should not wait on a full Android toolchain to be reported.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host DSP tests
        run: ./tools/run_dsp_tests.sh

  signaling-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run smoke

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testReleaseUnitTest
      - name: Lint
        run: ./gradlew lintRelease
      - name: Assemble release
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: kolan-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
