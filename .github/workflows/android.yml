name: Build APK

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - "index.html"
      - "maze-v*.zip"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build both apps
        working-directory: android
        run: ./gradlew assembleGameRelease assembleClubRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            android/app/build/outputs/apk/game/release/app-game-release.apk
            android/app/build/outputs/apk/club/release/app-club-release.apk
          if-no-files-found: error
