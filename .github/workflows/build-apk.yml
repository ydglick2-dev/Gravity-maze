name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # The release APK is signed with the keystore committed under signing/,
      # so every build stays upgrade-compatible with the one before it.
      - name: Build the release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Run the checks
        run: ./gradlew testDebugUnitTest lintRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Glassify-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload the lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
